    <script>
        // ==========================================
        // 1. DATA INIT
        const supabaseUrl = 'https://phgldyvshihyzimbwxci.supabase.co';
        const supabaseKey = 'sb_publishable_JvX1krFxCLzd1VA5ly7yxw_UiEcRwbO';
        const supaClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        
        const idb = {
            dbPromise: new Promise((resolve, reject) => {
                const req = indexedDB.open('iqmart_db', 1);
                req.onupgradeneeded = e => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('store')) db.createObjectStore('store');
                };
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e);
            }),
            async get(key) {
                const db = await this.dbPromise;
                return new Promise(resolve => {
                    const tx = db.transaction('store', 'readonly');
                    const req = tx.objectStore('store').get(key);
                    req.onsuccess = () => resolve(req.result);
                });
            },
            async set(key, val) {
                const db = await this.dbPromise;
                return new Promise(resolve => {
                    const tx = db.transaction('store', 'readwrite');
                    tx.objectStore('store').put(val, key);
                    tx.oncomplete = () => resolve();
                });
            }
        };

        let isArabic = localStorage.getItem('lang') === 'ar';
        let cart = [];
        let productsData = [];
        let categoriesData = [];
        let bannersData = [];
        let ordersData = [];
        let myOrderIds = JSON.parse(localStorage.getItem('myOrderIds') || '[]');
        let currentFilter = null;
        let currentProductPhotos = [];
        let heroInterval = null;

const dict = {
            en: {
                search: "Search products...",
                categories: "Categories",
                featured: "Featured Products",
                home: "Home",
                cart: "Cart",
                addToCart: "Add to Cart",
                cartTitle: "Your Cart",
                emptyCart: "Cart is empty",
                total: "Total Amount",
                checkout: "Checkout",
                descTitle: "Description",
                orders: "Orders",
                moTitle: "My Orders",
                moCancel: "Cancel Order",
                moEmpty: "No orders placed yet.",
                coTitle: "Checkout Details",
                coName: "Full Name",
                coPhone: "Phone Number",
                coCity: "City",
                coLoc: "Location / Address",
                coLocate: "Locate Me",
                coSubmit: "Place Order",
                mcTitle: "All Categories",
                statusPending: "Pending",
                statusReady: "Ready to deliver"
            },
            ar: {
                search: "ابحث عن المنتجات...",
                categories: "التصنيفات",
                featured: "منتجات مميزة",
                home: "الرئيسية",
                cart: "السلة",
                addToCart: "أضف للسلة",
                cartTitle: "سلة المشتريات",
                emptyCart: "السلة فارغة",
                total: "المجموع الكلي",
                checkout: "الدفع",
                descTitle: "الوصف",
                orders: "الطلبات",
                moTitle: "طلباتي",
                moCancel: "إلغاء الطلب",
                moEmpty: "لا توجد طلبات بعد.",
                coTitle: "تفاصيل الدفع",
                coName: "الاسم الكامل",
                coPhone: "رقم الهاتف",
                coCity: "المدينة",
                coLoc: "الموقع / العنوان",
                coLocate: "موقعي",
                coSubmit: "تأكيد الطلب",
                mcTitle: "جميع التصنيفات",
                statusPending: "قيد الانتظار",
                statusReady: "جاهز للتوصيل"
            }
        };

        const formatIQD = (num) => new Intl.NumberFormat('en-US').format(num) + ' IQD';

        const showToast = (msg, isError = false) => {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.querySelector('i').className = isError 
                ? 'ph-fill ph-warning-circle text-red-400 text-xl' 
                : 'ph-fill ph-check-circle text-green-400 text-xl';
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.add('-translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        };

        // File to Base64 Image Compressor
        const resizeAndConvertImage = (file, maxSize = 800) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        if (w > h && w > maxSize) { h *= maxSize/w; w = maxSize; }
                        else if (h > maxSize) { w *= maxSize/h; h = maxSize; }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        // ==========================================
        // 2. ROUTING & UI LANG
        // ==========================================

        let heroCurrentIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        const renderHero = () => {
            const container = document.getElementById('heroContainer');
            const dots = document.getElementById('heroDots');
            if (bannersData.length === 0) {
                container.innerHTML = '<div class="w-full h-full bg-gray-200 flex items-center justify-center"><span class="text-gray-400">No Banners</span></div>';
                dots.innerHTML = '';
                return;
            }
            
            heroCurrentIndex = 0;
            
            let imagesHtml = bannersData.map((b, i) => `
                <img src="${b.image_url}" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-500 ${i === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'}" id="banner-${i}">
            `).join('');
            
            let buttonsHtml = bannersData.length > 1 ? `
                <button onclick="prevBanner(event)" class="absolute left-2 md:left-4 top-1/2 -translate-y-1/2 bg-white/50 hover:bg-white/90 p-2 md:p-3 rounded-full shadow-md z-20 transition-all backdrop-blur-sm text-gray-800 rtl:right-2 rtl:left-auto rtl:md:right-4 hover:scale-110 active:scale-95">
                    <i class="ph-bold ph-caret-left text-xl"></i>
                </button>
                <button onclick="nextBanner(event)" class="absolute right-2 md:right-4 top-1/2 -translate-y-1/2 bg-white/50 hover:bg-white/90 p-2 md:p-3 rounded-full shadow-md z-20 transition-all backdrop-blur-sm text-gray-800 rtl:left-2 rtl:right-auto rtl:md:left-4 hover:scale-110 active:scale-95">
                    <i class="ph-bold ph-caret-right text-xl"></i>
                </button>
            ` : '';
            
            container.innerHTML = imagesHtml + buttonsHtml;
            
            dots.innerHTML = bannersData.map((_, i) => `
                <button class="w-2 h-2 rounded-full transition-all ${i === 0 ? 'bg-primary w-4' : 'bg-white/50'}" id="dot-${i}" onclick="switchBanner(${i}); startHeroInterval();"></button>
            `).join('');
            
            // Swipe support
            container.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, {passive: true});
            
            container.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, {passive: true});

            startHeroInterval();
        };

        const handleSwipe = () => {
            const threshold = 50; // min distance
            if (touchEndX < touchStartX - threshold) {
                // Swiped left
                isArabic ? prevBanner(null) : nextBanner(null);
            }
            if (touchEndX > touchStartX + threshold) {
                // Swiped right
                isArabic ? nextBanner(null) : prevBanner(null);
            }
        };

        const startHeroInterval = () => {
            if(heroInterval) clearInterval(heroInterval);
            if(bannersData.length <= 1) return;
            heroInterval = setInterval(() => {
                nextBanner(null);
            }, 3000); // 3 seconds per banner
        };

        const nextBanner = (e) => {
            if(e) { e.stopPropagation(); startHeroInterval(); }
            if(bannersData.length <= 1) return;
            heroCurrentIndex = (heroCurrentIndex + 1) % bannersData.length;
            switchBanner(heroCurrentIndex);
        };

        const prevBanner = (e) => {
            if(e) { e.stopPropagation(); startHeroInterval(); }
            if(bannersData.length <= 1) return;
            heroCurrentIndex = (heroCurrentIndex - 1 + bannersData.length) % bannersData.length;
            switchBanner(heroCurrentIndex);
        };

        const switchBanner = (index) => {
            heroCurrentIndex = index;
            bannersData.forEach((_, i) => {
                const img = document.getElementById(`banner-${i}`);
                const dot = document.getElementById(`dot-${i}`);
                if(img) {
                    if (i === index) {
                        img.classList.remove('opacity-0', 'z-0');
                        img.classList.add('opacity-100', 'z-10');
                    } else {
                        img.classList.remove('opacity-100', 'z-10');
                        img.classList.add('opacity-0', 'z-0');
                    }
                }
                if(dot) dot.className = `w-2 h-2 rounded-full transition-all ${i === index ? 'bg-primary w-4' : 'bg-white/50'}`;
            });
        };

        const renderCategories = () => {
            const container = document.getElementById('categoriesContainer');
            if(categoriesData.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
                <div class="flex flex-col items-center gap-2 cursor-pointer snap-start shrink-0 group ${currentFilter === null ? '' : 'opacity-50'}" onclick="filterCategory(null)">
                    <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl bg-white shadow-sm flex items-center justify-center border-2 ${currentFilter === null ? 'border-primary' : 'border-transparent group-hover:border-primary/30'} transition-all group-active:scale-95">
                        <i class="ph-fill ph-squares-four text-2xl md:text-3xl ${currentFilter === null ? 'text-primary' : 'text-gray-400 group-hover:text-primary'}"></i>
                    </div>
                    <span class="text-xs md:text-sm font-bold ${currentFilter === null ? 'text-primary' : 'text-gray-600'}">${isArabic ? 'الكل' : 'All'}</span>
                </div>
            ` + categoriesData.map(c => `
                <div class="flex flex-col items-center gap-2 cursor-pointer snap-start shrink-0 group ${currentFilter === c.id ? '' : 'opacity-50'}" onclick="filterCategory('${c.id}')">
                    <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl bg-white shadow-sm flex items-center justify-center border-2 p-3 ${currentFilter === c.id ? 'border-primary' : 'border-transparent group-hover:border-primary/30'} transition-all group-active:scale-95">
                        <img src="${c.icon_url}" class="w-full h-full object-contain">
                    </div>
                    <span class="text-xs md:text-sm font-bold ${currentFilter === c.id ? 'text-primary' : 'text-gray-600'}">${isArabic ? c.name_ar : c.name_en}</span>
                </div>
            `).join('');

            // Also for mobile Cat Modal
            const mcContainer = document.getElementById('mobileCatContainer');
            if(mcContainer) {
                mcContainer.innerHTML = categoriesData.map(c => `
                    <div class="flex flex-col items-center gap-2 cursor-pointer" onclick="filterCategory('${c.id}'); closeMobileCategories();">
                        <div class="w-full aspect-square rounded-2xl bg-gray-50 flex items-center justify-center p-4">
                            <img src="${c.icon_url}" class="w-full h-full object-contain">
                        </div>
                        <span class="text-xs font-bold text-center">${isArabic ? c.name_ar : c.name_en}</span>
                    </div>
                `).join('');
            }
        };

        const filterCategory = (id) => {
            currentFilter = id;
            renderCategories();
            renderProducts();
        };

        const renderProducts = () => {
            const container = document.getElementById('productsContainer');
            let data = currentFilter ? productsData.filter(p => p.category_id === currentFilter) : productsData;
            
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if(searchTerm) {
                data = data.filter(p => p.title.toLowerCase().includes(searchTerm) || (p.tags && p.tags.toLowerCase().includes(searchTerm)));
            }
            
            if(data.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">No products found</div>';
                return;
            }

            container.innerHTML = data.map(p => {
                const img = (p.images && p.images.length > 0) ? p.images[0] : p.image_url;
                return `
                <div class="bg-white rounded-2xl p-3 md:p-4 shadow-sm hover:shadow-xl transition-all duration-300 group cursor-pointer border border-gray-100 flex flex-col h-full" onclick="openProductModal('${p.id}')">
                    <div class="relative w-full aspect-square rounded-xl bg-[#F7F7F7] mb-3 md:mb-4 overflow-hidden">
                        <img src="${img}" class="absolute inset-0 w-full h-full object-contain p-2 mix-blend-multiply group-hover:scale-105 transition-transform duration-500">
                        <button class="absolute bottom-2 right-2 md:bottom-3 md:right-3 bg-white hover:bg-primary text-gray-900 hover:text-white w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center shadow-md transition-colors z-10" onclick="event.stopPropagation(); addToCart('${p.id}')">
                            <i class="ph-bold ph-plus md:text-lg"></i>
                        </button>
                    </div>
                    <div class="flex flex-col flex-1">
                        <h3 class="font-bold text-sm md:text-base text-gray-800 line-clamp-2 leading-tight mb-1 md:mb-2">${p.title}</h3>
                        <div class="mt-auto pt-2 flex items-end justify-between">
                            <span class="text-primary font-black text-sm md:text-lg">${formatIQD(p.price)}</span>
                        </div>
                    </div>
                </div>
            `}).join('');
        };
        
        const handleSearch = () => renderProducts();

        const openProductModal = (id) => {
            const prod = productsData.find(p => p.id === id);
            if(!prod) return;
            
            document.getElementById('pm_id').textContent = prod.id;
            document.getElementById('pm_title').textContent = prod.title;
            document.getElementById('pm_price').textContent = formatIQD(prod.price);
            document.getElementById('pm_desc').textContent = prod.description || '';
            
            const images = (prod.images && prod.images.length > 0) ? prod.images : [prod.image_url];
            
            document.getElementById('pm_slider').innerHTML = images.map((img, i) => `
                <div class="w-full h-full flex-shrink-0 flex items-center justify-center p-6" id="pm_slide_${i}">
                    <img src="${img}" class="max-w-full max-h-full object-contain drop-shadow-xl">
                </div>
            `).join('');
            
            if(images.length > 1) {
                document.getElementById('pm_dots').innerHTML = images.map((_, i) => `
                    <button class="w-2 h-2 rounded-full bg-gray-300 focus:bg-primary transition-colors" onclick="document.getElementById('pm_slide_${i}').scrollIntoView({behavior:'smooth'})"></button>
                `).join('');
            } else {
                document.getElementById('pm_dots').innerHTML = '';
            }
            
            document.getElementById('pm_add_btn').onclick = () => addToCart(prod.id);
            
            const modal = document.getElementById('productModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            
            document.body.style.overflow = 'hidden';
        };

        const closeProductModal = (e) => {
            if(e && e.target.id !== 'productModal') return;
            const modal = document.getElementById('productModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        };
        
        // --- CART LOGIC ---
        const toggleCart = () => {
            const sidebar = document.getElementById('cartSidebar');
            const overlay = document.getElementById('cartOverlay');
            if(sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
                document.body.style.overflow = 'auto';
            } else {
                sidebar.classList.add('open');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                document.body.style.overflow = 'hidden';
            }
        };

        const addToCart = (id) => {
            const prod = productsData.find(p => p.id === id);
            if(!prod) return;
            const existing = cart.find(c => c.id === id);
            if(existing) {
                existing.qty++;
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            idb.set('cart', cart);
            updateCartUI();
            showToast("Added to Cart");
        };

        const removeFromCart = (id) => {
            cart = cart.filter(c => c.id !== id);
            idb.set('cart', cart);
            updateCartUI();
        };

        const changeQty = (id, delta) => {
            const item = cart.find(c => c.id === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) removeFromCart(id);
                else {
                    idb.set('cart', cart);
                    updateCartUI();
                }
            }
        };

        const updateCartUI = () => {
            document.getElementById('cartCount').textContent = cart.reduce((s, i) => s + i.qty, 0);
            if (cart.length > 0) document.getElementById('cartCount').classList.remove('scale-0');
            else document.getElementById('cartCount').classList.add('scale-0');
            
            const container = document.getElementById('cartItems');
            if(cart.length === 0) {
                container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-gray-400 space-y-4"><i class="ph-fill ph-shopping-cart text-6xl"></i><p>${isArabic ? dict.ar.emptyCart : dict.en.emptyCart}</p></div>`;
            } else {
                container.innerHTML = cart.map(item => {
                    const img = (item.images && item.images.length > 0) ? item.images[0] : item.image_url;
                    return `
                    <div class="flex gap-4 bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                        <img src="${img}" class="w-20 h-20 object-contain bg-gray-50 rounded-xl">
                        <div class="flex-1 flex flex-col justify-between py-1">
                            <div>
                                <h4 class="font-bold text-sm text-gray-800 line-clamp-2">${item.title}</h4>
                                <div class="text-primary font-black text-sm mt-1">${formatIQD(item.price)}</div>
                            </div>
                            <div class="flex items-center justify-between mt-2">
                                <div class="flex items-center bg-gray-50 rounded-lg border border-gray-200">
                                    <button class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-primary transition-colors" onclick="changeQty('${item.id}', -1)"><i class="ph-bold ph-minus"></i></button>
                                    <span class="w-6 text-center font-bold text-sm select-none">${item.qty}</span>
                                    <button class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-primary transition-colors" onclick="changeQty('${item.id}', 1)"><i class="ph-bold ph-plus"></i></button>
                                </div>
                                <button class="text-red-400 hover:text-red-500 p-2" onclick="removeFromCart('${item.id}')"><i class="ph-bold ph-trash text-lg"></i></button>
                            </div>
                        </div>
                    </div>
                `}).join('');
            }
            
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('cartTotalAmount').textContent = formatIQD(total);
        };

        const openCheckoutModal = () => {
            if(cart.length === 0) return;
            toggleCart();
            const modal = document.getElementById('checkoutModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        };

        const closeCheckoutModal = () => {
            const modal = document.getElementById('checkoutModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        const goHome = () => {
            currentFilter = null;
            document.getElementById('searchInput').value = '';
            renderCategories();
            renderProducts();
            window.scrollTo(0,0);
        };
        
        const openMobileCategories = () => {
            const modal = document.getElementById('mobileCatModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            document.body.style.overflow = 'hidden';
        };

        const closeMobileCategories = () => {
            const modal = document.getElementById('mobileCatModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        };

        const closeMyOrders = (e) => {
            if(e && e.target.id !== 'myOrdersModal') return;
            const modal = document.getElementById('myOrdersModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        const locateMe = () => {
            const btn = document.getElementById('co_btn_locate');
            btn.textContent = isArabic ? 'جاري التحديد...' : 'Locating...';
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        document.getElementById('co_loc').value = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                        btn.textContent = isArabic ? 'تم التحديد' : 'Located';
                    },
                    (err) => {
                        showToast(isArabic ? 'فشل في تحديد الموقع' : 'Failed to locate', true);
                        btn.textContent = isArabic ? 'تحديد موقعي' : 'Locate Me';
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            } else {
                showToast("Not supported", true);
            }
        };

        const applyLanguage = () => {
            
            document.documentElement.setAttribute('dir', isArabic ? 'rtl' : 'ltr');
            document.getElementById('langToggle').textContent = isArabic ? 'EN' : 'AR';
            // update dict texts...
            document.getElementById('searchInput').placeholder = isArabic ? dict.ar.search : dict.en.search;
            document.getElementById('catTitle').textContent = isArabic ? dict.ar.categories : dict.en.categories;
            document.getElementById('prodTitle').textContent = isArabic ? dict.ar.featured : dict.en.featured;
            document.getElementById('cartTitle').textContent = isArabic ? dict.ar.cartTitle : dict.en.cartTitle;
            document.getElementById('checkoutBtn').textContent = isArabic ? dict.ar.checkout : dict.en.checkout;
            document.getElementById('pm_add_text').textContent = isArabic ? dict.ar.addToCart : dict.en.addToCart;
            document.getElementById('pm_desc_title').textContent = isArabic ? dict.ar.descTitle : dict.en.descTitle;
            document.getElementById('myOrdersText').textContent = isArabic ? dict.ar.orders : dict.en.orders;
            document.getElementById('mo_title').textContent = isArabic ? dict.ar.moTitle : dict.en.moTitle;
            document.getElementById('co_title').textContent = isArabic ? dict.ar.coTitle : dict.en.coTitle;
            document.getElementById('co_lbl_name').textContent = isArabic ? dict.ar.coName : dict.en.coName;
            document.getElementById('co_lbl_phone').textContent = isArabic ? dict.ar.coPhone : dict.en.coPhone;
            document.getElementById('co_lbl_city').textContent = isArabic ? dict.ar.coCity : dict.en.coCity;
            document.getElementById('co_lbl_loc').textContent = isArabic ? dict.ar.coLoc : dict.en.coLoc;
            document.getElementById('co_btn_locate').textContent = isArabic ? dict.ar.coLocate : dict.en.coLocate;
            document.getElementById('co_btn_submit').textContent = isArabic ? dict.ar.coSubmit : dict.en.coSubmit;
            document.getElementById('cartTotalText').textContent = isArabic ? dict.ar.total : dict.en.total;
            document.getElementById('mc_title').textContent = isArabic ? dict.ar.mcTitle : dict.en.mcTitle;
            
            document.getElementById('navHome').textContent = isArabic ? dict.ar.home : dict.en.home;
            document.getElementById('navCat').textContent = isArabic ? dict.ar.categories : dict.en.categories;
            document.getElementById('navOrders').textContent = isArabic ? dict.ar.orders : dict.en.orders;
            document.getElementById('navCart').textContent = isArabic ? dict.ar.cart : dict.en.cart;
            
            updateCartUI();
            renderCategories();
            renderProducts();
        };

        const toggleLanguage = () => {
            isArabic = !isArabic;
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            applyLanguage();
        };


        
        const fetchStoreData = async () => {
            try {
                const [pRes, cRes, bRes, oRes] = await Promise.all([
                    supaClient.from('products').select('*'),
                    supaClient.from('categories').select('*'),
                    supaClient.from('banners').select('*'),
                    supaClient.from('orders').select('*')
                ]);
                productsData = pRes.data || [];
                categoriesData = cRes.data || [];
                bannersData = bRes.data || [];
                ordersData = oRes.data || [];
                
                renderHero();
                renderCategories();
                renderProducts();
            } catch(e) {
                console.error("Error fetching data:", e);
            }
        };

        const submitOrder = async () => {
            const name = document.getElementById('co_name').value;
            const phone = document.getElementById('co_phone').value;
            const city = document.getElementById('co_city').value;
            const loc = document.getElementById('co_loc').value;
            
            if(!name || !phone || !city) return showToast(isArabic ? 'يرجى ملء الحقول الأساسية' : 'Please fill required fields', true);
            
            const btn = document.getElementById('co_btn_submit');
            btn.disabled = true;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-xl"></i>';
            
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            
            const customer = { name, phone, city, loc };
            const items = cart.map(c => ({ id: c.id, title: c.title, price: c.price, qty: c.qty }));
            
            const { data, error } = await supaClient.from('orders').insert([{ customer, items, total_amount: total }]).select();
            
            btn.disabled = false;
            btn.innerHTML = isArabic ? dict.ar.coSubmit : dict.en.coSubmit;
            
            if(error) return showToast("Error: " + error.message, true);
            
            if(data && data.length > 0) {
                myOrderIds.push(data[0].id);
                localStorage.setItem('myOrderIds', JSON.stringify(myOrderIds));
            }
            
            cart = [];
            idb.set('cart', []);
            updateCartUI();
            
            document.getElementById('co_name').value = '';
            document.getElementById('co_phone').value = '';
            document.getElementById('co_city').value = '';
            document.getElementById('co_loc').value = '';
            
            closeCheckoutModal();
            showToast(isArabic ? 'تم الطلب بنجاح!' : 'Order placed successfully!');
            fetchStoreData();
        };

        const cancelMyOrder = async (id) => {
            if(!confirm(isArabic ? 'هل أنت متأكد من إلغاء هذا الطلب؟' : 'Are you sure you want to cancel this order?')) return;
            const { error } = await supaClient.from('orders').delete().eq('id', id);
            if(error) return showToast("Error: " + error.message, true);
            
            myOrderIds = myOrderIds.filter(oid => oid !== id);
            localStorage.setItem('myOrderIds', JSON.stringify(myOrderIds));
            
            showToast(isArabic ? 'تم إلغاء الطلب' : 'Order cancelled');
            fetchStoreData();
        };
        
        const renderMyOrdersList = () => {
            const container = document.getElementById('myOrdersList');
            if(!container) return;
            const myOrders = ordersData.filter(o => myOrderIds.includes(o.id));
            
            if(myOrders.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-10">${isArabic ? 'لا توجد طلبات' : 'No orders found'}</div>`;
            } else {
                container.innerHTML = myOrders.map(o => {
                    let statusColor = o.status === 'Pending' ? 'bg-orange-100 text-orange-600' : 'bg-green-100 text-green-600';
                    let cancelBtn = o.status === 'Pending' ? `<button onclick="cancelMyOrder('${o.id}')" class="mt-3 w-full py-2 bg-red-50 text-red-500 hover:bg-red-100 rounded-lg text-xs font-bold transition-colors">${isArabic ? 'إلغاء الطلب' : 'Cancel Order'}</button>` : '';
                    let statusText = o.status;
                    if(isArabic) {
                        if(o.status === 'Pending') statusText = 'قيد الانتظار';
                        if(o.status === 'Ready') statusText = 'جاهز';
                        if(o.status === 'Complete') statusText = 'مكتمل';
                    }
                    
                    return `
                    <div class="bg-gray-50 rounded-xl p-4 border border-gray-200">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-gray-500 font-mono">${o.id.split('-')[0]}</span>
                            <span class="text-xs font-bold px-2 py-1 rounded-full ${statusColor}">${statusText}</span>
                        </div>
                        <div class="font-bold text-gray-800 mb-2">${formatIQD(o.total_amount)}</div>
                        <div class="space-y-1">
                            ${o.items.map(i => `<div class="text-xs text-gray-600 flex justify-between"><span>${i.qty}x ${i.title}</span></div>`).join('')}
                        </div>
                        ${cancelBtn}
                    </div>
                    `;
                }).join('');
            }
        };

        const openMyOrders = () => {
            renderMyOrdersList();
            const modal = document.getElementById('myOrdersModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        };

        document.addEventListener('DOMContentLoaded', async () => {
            applyLanguage();
            const savedCart = await idb.get('cart');
            if (savedCart) cart = savedCart;
            
            updateCartUI();
            fetchStoreData();
        });


        // Auto-refresh My Orders in the background
        setInterval(async () => {
            if(myOrderIds.length > 0) {
                try {
                    const { data, error } = await supaClient.from('orders').select('*').in('id', myOrderIds);
                    if(data && !error) {
                        const fetchedIds = data.map(o => o.id);
                        let deletedAny = false;
                        
                        myOrderIds = myOrderIds.filter(id => {
                            if (!fetchedIds.includes(id)) {
                                deletedAny = true;
                                return false;
                            }
                            return true;
                        });
                        
                        if (deletedAny) {
                            localStorage.setItem('myOrderIds', JSON.stringify(myOrderIds));
                        }
                        
                        data.forEach(freshOrder => {
                            const idx = ordersData.findIndex(o => o.id === freshOrder.id);
                            if(idx > -1) ordersData[idx] = freshOrder;
                            else ordersData.push(freshOrder);
                        });
                        
                        const modal = document.getElementById('myOrdersModal');
                        if(modal && !modal.classList.contains('hidden')) {
                            renderMyOrdersList();
                        }
                    }
                } catch(e) {}
            }
        }, 3000); // 3 seconds polling for very fast reaction

</script>
</body>
</html>
